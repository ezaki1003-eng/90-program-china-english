<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>多聴 動画と台本</title>
<style>
/* 上に動画をはりつけ、下の台本をタップするとその場所から再生する1列のページ */
:root{
  --bg:#f6f7f4; --card:#ffffff; --fg:#1f2a24; --sub:#5d6b63; --line:#dfe5df;
  --accent:#1f7a5a; --now:#e5f3ec; --nowbar:#1f7a5a;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141a17; --card:#1c2420; --fg:#e8eee9; --sub:#9fb0a6; --line:#2c3832; --accent:#5cc79a; --now:#203a2f; --nowbar:#5cc79a; color-scheme:dark }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:40px}
header{padding-block:12px 6px}
h1{font-size:20px;margin:0}
.lead{color:var(--sub);font-size:14px;margin:2px 0 0}
.player{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.frame iframe,.frame>div{position:absolute;inset:0;width:100%;height:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bar button{flex:1 1 0;min-width:72px;font:inherit;font-size:16px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.bar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar button:focus-visible,.line:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.script{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.line{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.line .t{font-size:14px;color:var(--accent);font-variant-numeric:tabular-nums;padding-top:4px}
.line .en{font-size:19px;min-width:0}
.line .ja{grid-column:2;font-size:15px;color:var(--sub);min-width:0}
.hideja .ja{display:none}
.line.now{background:var(--now);border-color:var(--nowbar);box-shadow:inset 5px 0 0 var(--nowbar)}
.note{font-size:13px;color:var(--sub);margin-top:14px}
details{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
summary{cursor:pointer;font-weight:bold}
label{display:block;font-size:14px;margin-top:10px;color:var(--sub)}
input,textarea{width:100%;font:inherit;font-size:15px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{min-height:160px}
.go{margin-top:10px;font:inherit;padding:10px 16px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="ttl">多聴 第1回（見本）</h1>
    <p class="lead">文をタップすると、その場所から流れます。動画は上にとまったまま、台本だけが動きます。</p>
  </header>

  <div class="player">
    <div class="frame"><div id="yt"></div></div>
    <div class="bar">
      <button id="back" type="button">⏪ 5秒</button>
      <button id="play" type="button">▶ 再生</button>
      <button id="slow" type="button">ゆっくり</button>
      <button id="ja" type="button" class="on">日本語</button>
    </div>
  </div>

  <div id="script" class="script"></div>

  <p class="note">※見本です。動画と台本の時間はまだ合わせていません（形を見ていただくためのもの）。見本の動画は、ほかの方の公開動画を借りています。本番は多聴の動画と台本を入れます。</p>

  <details>
    <summary>自分の動画と台本で試す</summary>
    <label for="url">YouTube の URL</label>
    <input id="url" type="text" placeholder="https://youtu.be/...">
    <label for="src">台本（1行に1文。「時間 英語 | 日本語」）</label>
    <textarea id="src"></textarea>
    <button id="apply" class="go" type="button">このページに出す</button>
  </details>
</div>

<script>
const SAMPLE_URL = "https://youtu.be/C-8ZofOsWyY";
const SAMPLE = `0:00 Hi! Can I get a coffee, please? | こんにちは。コーヒーをください。
0:04 Sure. What size would you like? | はい。サイズはどうしますか？
0:08 Medium, please. | Mサイズでお願いします。
0:11 For here or to go? | こちらで飲みますか、持ち帰りますか？
0:15 To go, please. | 持ち帰りでお願いします。
0:18 Anything else? | ほかにご注文は？
0:21 No, that's all. Thank you. | いいえ、それで全部です。ありがとう。
0:25 That'll be four dollars. | 4ドルです。
0:29 Here you are. | はい、どうぞ。
0:32 Have a nice day! | よい一日を！`;

let lines = [], player = null, ready = false, cur = -1, slow = false;
const $ = id => document.getElementById(id);

function toSec(s){ const p = s.split(":").map(Number); return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1]; }
function vid(u){ const m = u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : null; }
function parse(text){
  return text.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const m = l.match(/^(\d+:\d{2}(?::\d{2})?)\s+(.*)$/); if(!m) return null;
    const [en, ja=""] = m[2].split("|").map(x=>x.trim());
    return {t:toSec(m[1]), label:m[1], en, ja};
  }).filter(Boolean).sort((a,b)=>a.t-b.t);
}
function render(){
  const box = $("script"); box.textContent = "";
  lines.forEach((ln,i)=>{
    const b = document.createElement("button"); b.type="button"; b.className="line"; b.dataset.i=i;
    const t = document.createElement("span"); t.className="t"; t.textContent=ln.label;
    const en = document.createElement("span"); en.className="en"; en.textContent=ln.en;
    const ja = document.createElement("span"); ja.className="ja"; ja.textContent=ln.ja;
    b.append(t,en,ja); b.addEventListener("click",()=>jump(i)); box.append(b);
  });
  cur = -1;
}
function jump(i){
  if(!ready) return;
  player.seekTo(lines[i].t, true); player.playVideo(); mark(i);
}
function mark(i){
  if(i===cur) return;
  const all = document.querySelectorAll(".line");
  if(all[cur]) all[cur].classList.remove("now");
  cur = i;
  if(all[i]){
    all[i].classList.add("now");
    const top = all[i].getBoundingClientRect().top + scrollY - document.querySelector(".player").offsetHeight - 10;
    scrollTo({top, behavior:"smooth"});
  }
}
function tick(){
  if(ready && player.getCurrentTime){
    const now = player.getCurrentTime();
    let i = -1; for(let k=0;k<lines.length;k++){ if(lines[k].t <= now+0.2) i=k; }
    if(i>=0) mark(i);
    const st = player.getPlayerState();
    $("play").textContent = st===1 ? "⏸ 止める" : "▶ 再生";
  }
  setTimeout(tick, 400);
}
function load(url, text){
  lines = parse(text); render();
  const id = vid(url);
  if(player && ready && id) player.cueVideoById(id);
  return id;
}

$("back").onclick = ()=>{ if(ready) player.seekTo(Math.max(0, player.getCurrentTime()-5), true); };
$("play").onclick = ()=>{ if(!ready) return; player.getPlayerState()===1 ? player.pauseVideo() : player.playVideo(); };
$("slow").onclick = e=>{ slow=!slow; e.target.classList.toggle("on",slow); if(ready) player.setPlaybackRate(slow?0.75:1); };
$("ja").onclick = e=>{ const on = !e.target.classList.contains("on"); e.target.classList.toggle("on",on); $("script").classList.toggle("hideja",!on); };
$("apply").onclick = ()=>{
  const url=$("url").value.trim(), text=$("src").value;
  if(!vid(url)){ $("url").focus(); $("url").placeholder="URL を入れてください（youtu.be/… など）"; return; }
  load(url,text);
  try{ localStorage.setItem("tacho", JSON.stringify({url,text})); }catch(e){}
  scrollTo({top:0,behavior:"smooth"});
};

let start = {url:SAMPLE_URL, text:SAMPLE};
try{ const s = JSON.parse(localStorage.getItem("tacho")||"null"); if(s && vid(s.url)) start = s; }catch(e){}
$("url").value = start.url; $("src").value = start.text;
lines = parse(start.text); render();

window.onYouTubeIframeAPIReady = ()=>{
  player = new YT.Player("yt",{ videoId: vid(start.url), playerVars:{playsinline:1, rel:0},
    events:{ onReady:()=>{ ready=true; } } });
};
const s = document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; document.head.append(s);
tick();
</script>
</body>
</html>
